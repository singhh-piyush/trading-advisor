name: Update Trading Radar

# Refresh the news triage every ~30 minutes, plus a manual trigger.
# GitHub runs scheduled jobs best-effort, so they can fire late or skip.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Needed so the job can commit the regenerated results.json back to the repo.
permissions:
  contents: write

concurrency:
  group: update-trading-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analyzer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: python analyze.py

      - name: Commit results.json if it changed
        run: |
          if git diff --quiet -- results.json; then
            echo "results.json unchanged; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results.json
            git commit -m "chore: refresh trading radar results"
            git push
          fi
